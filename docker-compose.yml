version: "3.8"

services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    command: gunicorn backend.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8001:8000"
    depends_on:
      - redis
    environment:
      DEBUG: "0"
      SECRET_KEY: "your_secret_key_here"
      DATABASE_URL: "postgres://user:password@db:5432/vags"

  web:
    build: ./front
    ports:
      - "8080:80"
    depends_on:
      - backend
    environment:
      VITE_API_PROD: "http://backend:8000/api/"
